services:
  candig-data-portal:
    labels:
      - "candigv2=candig-data-portal"
    build:
      context: $PWD/lib/candig-data-portal/candig-data-portal
      args:
        katsu_api_target_url: "${TYK_KATSU_API_TARGET}"
        VITE_BASE_NAME: "/"
        VITE_FEDERATION_API_SERVER: "${FEDERATION_PUBLIC_URL}"
        VITE_INGEST_SERVER: "${CANDIG_INGEST_PUBLIC_URL}"
        VITE_HTSGET_SERVER: "${HTSGET_PUBLIC_URL}"
        VITE_KATSU_API_SERVER: "${KATSU_PUBLIC_URL}"
        VITE_SUPPORT_EMAIL: "${CANDIG_DATA_PORTAL_SUPPORT_EMAIL}"
    image: ${DOCKER_REGISTRY}/candig-data-portal:${CANDIG_DATA_PORTAL_VERSION:-latest}
    ports:
      - "${CANDIG_DATA_PORTAL_PORT}:4173"
    logging:
      driver: "fluentd"
      options:
        tag: "{{.Name}}"
    extra_hosts:
        - "${CANDIG_DOMAIN}:${LOCAL_IP_ADDR}"
    environment:
      - VITE_SITE_LOCATION=${CANDIG_SITE_LOCATION}
      - VITE_CANDIG_VERSION=${CANDIG_VERSION}
      - DEBUG_MODE=${CANDIG_DEBUG_MODE}
      - WDS_SOCKET_PORT=0
      - AGGREGATE_COUNT_THRESHOLD=${AGGREGATE_COUNT_THRESHOLD}
      - VITE_SUPPORT_EMAIL=${CANDIG_DATA_PORTAL_SUPPORT_EMAIL}
      - CANDIG_DOMAIN=${CANDIG_DOMAIN}
    healthcheck:
      test: [ "CMD", "curl", "${CANDIG_DATA_PORTAL_PRIVATE_URL}" ]
      interval: 30s
      timeout: 20s
      retries: 3
