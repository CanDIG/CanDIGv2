services:
  transcriptomics:
    build:
      context: $PWD/lib/transcriptomics/transcriptomics
    # image: ghcr.io/bento-platform/transcriptomics_data_service:edge
    labels:
      - "candigv2=transcriptomics"
    logging:
      driver: "fluentd"
      options:
        tag: "{{.Name}}"
    ports:
      - "${TRANSCRIPTOMICS_PORT}:5000"
    environment:
      - CORS_ORIGINS="*"
      - BENTO_AUTHZ_SERVICE_URL=""
      - OPA_URL=${OPA_PRIVATE_URL}
      - VAULT_URL=${VAULT_PRIVATE_URL}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${DEFAULT_ADMIN_USER}
      - DB_NAME=tds_db
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - WORKERS=2
    extra_hosts:
      - "${CANDIG_DOMAIN}:${LOCAL_IP_ADDR}"
    secrets:
      - source: postgres-db-secret
        target: db_password

